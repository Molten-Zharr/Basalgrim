[package]
name = "basalgrim"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "basalgrim"
description = "Molten-Zharr native GUI/TUI file manager"
license = "MIT"

[features]
default = ["guitui"]
guitui = ["dep:eframe", "dep:egui_ratatui", "dep:soft_ratatui", "dep:rustc-hash", "dep:resvg", "dep:image", "file-clipboard", "dep:raw-window-handle"]
tui = ["dep:crossterm", "ratatui/crossterm", "dep:ratatui-image", "dep:resvg", "dep:image", "dep:base64", "file-clipboard"]
file-clipboard = ["dep:x11rb", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[[bin]]
name = "basalgrim"
path = "src/main.rs"
required-features = ["guitui"]

[[bin]]
name = "basalgrim-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[example]]
name = "preview"
required-features = ["guitui"]

[dependencies]
anyhow = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["osc52", "osc"], optional = true }
base64 = { version = "0.22", optional = true }
eframe = { version = "~0.34.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui_ratatui = { version = "2.2.0", optional = true }
soft_ratatui = { version = "~0.2.0", default-features = false, features = ["embedded-ttf"], optional = true }
rustc-hash = { version = "2.1", optional = true }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"
resvg = { version = "0.48.1", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"], optional = true }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"], optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
raw-window-handle = { version = "0.6.2", optional = true }
x11rb = { version = "0.13.2", features = ["xfixes"], optional = true }
wayland-client = { version = "0.31.15", features = ["system", "dlopen"], optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "event", "process", "rand", "pipe", "time"] }

[profile.dev]
opt-level = 1
# Full debug symbols and retained incremental generations made target grow
# disproportionately across GUI/TUI feature sets. Keep ordinary builds compact.
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Preserve clipboard key presses for configurable file commands, including
# Ctrl+V when the OS clipboard has no text. See vendor/egui-winit/BASALGRIM.md.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
crossterm = { path = "vendor/crossterm" }
winit = { path = "vendor/winit" }
