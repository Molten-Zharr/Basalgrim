[package]
name = "basalgrim"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "basalgrim"
description = "Molten-Zharr native GUI/TUI file manager"
license = "MIT"

[features]
default = ["guitui"]
guitui = ["dep:eframe", "dep:egui_ratatui", "dep:soft_ratatui", "dep:rustc-hash"]
tui = ["dep:crossterm", "ratatui/crossterm"]

[[bin]]
name = "basalgrim"
path = "src/main.rs"
required-features = ["guitui"]

[[bin]]
name = "basalgrim-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[example]]
name = "preview"
required-features = ["guitui"]

[dependencies]
anyhow = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", optional = true }
eframe = { version = "~0.34.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui_ratatui = { version = "2.2.0", optional = true }
soft_ratatui = { version = "~0.2.0", default-features = false, features = ["embedded-ttf"], optional = true }
rustc-hash = { version = "2.1", optional = true }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[profile.dev]
opt-level = 1
