name: Rust
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --no-default-features --features tui --all-targets
      - run: cargo build --locked --no-default-features --features tui --bin basalgrim-tui
      - run: python3 scripts/smoke_tui.py
      - run: python3 scripts/smoke_selection.py
      - run: python3 scripts/smoke_scroll.py
      - run: python3 scripts/smoke_watch.py
      - run: python3 scripts/smoke_move.py
      - run: python3 scripts/smoke_conflicts.py
      - run: python3 scripts/smoke_panes.py
      - run: python3 scripts/smoke_session.py
      - run: python3 scripts/smoke_journal.py
      - run: cargo run --locked --example preview
      - uses: actions/upload-artifact@v4
        with:
          name: interface-previews
          path: target/preview/*.ppm
